name: World auth CI
on:
  push:
    branches: [develop/world-auth]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@9 --activate
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - run: pnpm install --frozen-lockfile
        working-directory: backend
      - run: pnpm exec tsc --noEmit
        working-directory: backend
      - name: Smoke test disabled payments and unconfigured auth
        working-directory: backend
        run: |
          pnpm exec tsx index.ts &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://localhost:3000/ping
          for route in verify initiate-payment confirm-payment; do
            test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{}' http://localhost:3000/$route)" = 503
          done
